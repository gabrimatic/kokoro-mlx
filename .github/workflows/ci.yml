name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/dependabot.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python checks
    # MLX needs Apple Silicon with Metal; the numerics under test are the macOS arm64 ones.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src/ tests/

      - name: Import smoke test
        run: |
          python -c "
          from kokoro_mlx import KokoroTTS, TTSResult, __version__
          from kokoro_mlx.model import KokoroModel
          from kokoro_mlx.modules import TextEncoder, ProsodyPredictor
          from kokoro_mlx.istftnet import Generator, Decoder
          from kokoro_mlx.generate import generate, generate_stream
          from kokoro_mlx.phonemize import Phonemizer
          from kokoro_mlx.voices import VoiceManager
          from kokoro_mlx.config import KokoroConfig, ISTFTNetConfig, PLBertConfig
          print('All imports OK', __version__)
          "

      - name: Unit tests
        run: python -m pytest tests/ -v -m "not slow"
